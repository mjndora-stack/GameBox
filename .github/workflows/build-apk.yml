name: Build VaultPlay APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MGR" ]; then
            SDK_MGR="$(command -v sdkmanager)"
          fi
          mkdir -p "$SDK_DIR/licenses"
          yes | "$SDK_MGR" --licenses > /dev/null || true
          "$SDK_MGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDK_MGR" "platforms;android-36.1" || true

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build Debug APK
        run: /tmp/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK with clean filename
        run: cp app/build/outputs/apk/debug/app-debug.apk VaultPlay-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultPlay-APK
          path: VaultPlay-debug.apk

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VaultPlay-debug.apk
          generate_release_notes: true
