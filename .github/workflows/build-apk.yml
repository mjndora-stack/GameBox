name: Build VaultPlay APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MGR" ]; then
            SDK_MGR="$(command -v sdkmanager || true)"
          fi
          echo "Using SDK_DIR=$SDK_DIR SDK_MGR=$SDK_MGR"
          mkdir -p "$SDK_DIR/licenses"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
            "$SDK_MGR" --update > /dev/null 2>&1 || true
            "$SDK_MGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            "$SDK_MGR" "platforms;android-36.1" "build-tools;36.1.0" || true
          else
            echo "::error::sdkmanager not found in $SDK_DIR or PATH"
            exit 1
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Prepare debug keystore and env
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          [ -f .env ] || cp .env.example .env

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! /tmp/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; then
            ERR_TAIL=$(grep -iE "FAILURE:|What went wrong:|Could not|Execution failed|Exception" /tmp/gradle.log | tail -n 12 | tr '\n' ' ')
            echo "::error::Gradle failed: ${ERR_TAIL:-See build step logs}"
            exit 1
          fi

      - name: Copy APK with clean filename
        run: cp app/build/outputs/apk/debug/app-debug.apk VaultPlay-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultPlay-APK
          path: VaultPlay-debug.apk

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VaultPlay-debug.apk
          generate_release_notes: true
