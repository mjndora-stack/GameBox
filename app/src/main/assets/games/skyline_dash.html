<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Skyline Dash</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #140F1C; color: #F7F2EB; font-family: system-ui, -apple-system, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font-family: monospace; font-size: 13px; }
  .pill { background: rgba(24, 18, 34, 0.84); border: 1px solid rgba(255, 179, 71, 0.45); padding: 6px 10px; border-radius: 999px; }
  .controls { position: absolute; bottom: 18px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
  .btn { pointer-events: auto; width: 88px; height: 64px; border-radius: 18px; background: rgba(28, 20, 40, 0.8); border: 1.5px solid rgba(255, 179, 71, 0.55); color: #FFC66D; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
  .btn:active { background: rgba(255, 179, 71, 0.3); transform: scale(0.95); }
  .btn-dash { border-color: rgba(255, 107, 139, 0.65); color: #FF8AA4; }
  #overlay { position: absolute; inset: 0; background: rgba(16, 11, 24, 0.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
  #overlay h1 { margin: 0; font-size: 28px; color: #FFB347; letter-spacing: 1.2px; }
  #overlay p { margin: 0; max-width: 320px; font-size: 14px; color: #D4C8DA; line-height: 1.45; }
  #startBtn { margin-top: 8px; padding: 12px 28px; border-radius: 999px; border: none; background: #FFB347; color: #19101F; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pill" id="distPill">0m</div>
    <div class="pill" id="comboPill">CREDITS 0</div>
    <div class="pill" id="bestPill">SPEED 1.0x</div>
  </div>
  <div class="controls">
    <button class="btn btn-dash" id="btnDash">DASH</button>
    <button class="btn" id="btnJump">JUMP</button>
  </div>
  <div id="overlay">
    <h1>SKYLINE DASH</h1>
    <p>High-tempo rooftop runner. Double-jump across skyscraper gaps and trigger Air-Dash to smash through laser drones.</p>
    <p style="font-size:12px;color:#A596B0;">Tap Jump / Dash or press Space / Shift</p>
    <button id="startBtn">START RUN</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const distPill = document.getElementById('distPill');
  const comboPill = document.getElementById('comboPill');
  const bestPill = document.getElementById('bestPill');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  let W = 800, H = 480;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  let running = false;
  let roofs = [], drones = [], coins = [], trails = [];
  let runner, speed, distance, credits, lastSubmittedMilestone = 0;

  function bridgeAward(xp, pts, achId) {
    try {
      if (window.VaultBridge) {
        if (xp > 0) window.VaultBridge.awardXp('skyline_dash', xp);
        if (pts > 0) window.VaultBridge.submitScore('skyline_dash', pts);
        if (achId) window.VaultBridge.unlockAchievement(achId);
      }
    } catch (_) {}
  }

  function reset() {
    speed = 290;
    distance = 0;
    credits = 0;
    lastSubmittedMilestone = 0;
    const baseY = H * 0.68;
    roofs = [
      { x: 0, y: baseY, w: 460, h: H - baseY + 60 },
      { x: 540, y: baseY - 30, w: 320, h: H - baseY + 90 },
      { x: 940, y: baseY + 15, w: 360, h: H - baseY + 60 }
    ];
    drones = [];
    coins = [{ x: 340, y: baseY - 52, taken: false }, { x: 650, y: baseY - 82, taken: false }];
    trails = [];
    runner = { x: 96, y: baseY - 36, w: 26, h: 36, vy: 0, jumps: 2, dashTimer: 0, dashCd: 0 };
    updateHud();
  }

  function doJump() {
    if (!running) return;
    if (runner.jumps > 0) {
      runner.vy = -465;
      runner.jumps--;
      for (let i = 0; i < 6; i++) trails.push({ x: runner.x, y: runner.y + 30, vx: -80 - Math.random()*80, vy: (Math.random()-0.5)*90, life: 0.35, color: '#FFB347' });
    }
  }

  function doDash() {
    if (!running || runner.dashCd > 0) return;
    runner.dashTimer = 0.24;
    runner.dashCd = 0.85;
    runner.vy = 0;
    for (let i = 0; i < 10; i++) trails.push({ x: runner.x, y: runner.y + 18, vx: -200 - Math.random()*100, vy: (Math.random()-0.5)*110, life: 0.4, color: '#FF6B8B' });
  }

  document.getElementById('btnJump').addEventListener('pointerdown', (e) => { e.preventDefault(); doJump(); });
  document.getElementById('btnDash').addEventListener('pointerdown', (e) => { e.preventDefault(); doDash(); });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') doJump();
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') doDash();
  });

  function updateHud() {
    const score = Math.floor(distance) + credits * 25;
    distPill.textContent = `${Math.floor(distance)}m`;
    comboPill.textContent = `SCORE ${score}`;
    bestPill.textContent = `SPEED ${(speed / 290).toFixed(1)}x`;
  }

  function endRun() {
    running = false;
    const finalScore = Math.floor(distance) + credits * 25;
    const earnedXp = Math.max(15, Math.floor(finalScore / 20));
    bridgeAward(earnedXp, finalScore, finalScore >= 600 ? 'skyline_ace' : null);
    overlay.querySelector('h1').textContent = 'WIPEOUT';
    overlay.querySelector('p').textContent = `Covered ${Math.floor(distance)}m · Score ${finalScore}. +${earnedXp} XP synced to Vault.`;
    startBtn.textContent = 'RUN AGAIN';
    overlay.style.display = 'flex';
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.035);
    last = now;
    if (running) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    const curSpeed = runner.dashTimer > 0 ? speed * 1.9 : speed;
    speed = Math.min(540, speed + dt * 7.5);
    distance += (curSpeed * dt) / 16;

    if (runner.dashTimer > 0) runner.dashTimer -= dt;
    if (runner.dashCd > 0) runner.dashCd -= dt;

    if (runner.dashTimer <= 0) {
      runner.vy += 1160 * dt;
    }

    const prevBottom = runner.y + runner.h;
    runner.y += runner.vy * dt;

    for (const r of roofs) {
      r.x -= curSpeed * dt;
      if (runner.x + runner.w > r.x + 2 && runner.x < r.x + r.w - 2) {
        if (runner.vy >= 0 && prevBottom <= r.y + 14 && runner.y + runner.h >= r.y) {
          runner.y = r.y - runner.h;
          runner.vy = 0;
          runner.jumps = 2;
        }
      }
    }

    // Spawn new rooftops
    const lastRoof = roofs[roofs.length - 1];
    if (lastRoof.x + lastRoof.w < W + 260) {
      const gap = 85 + Math.random() * 95;
      const w = 220 + Math.random() * 240;
      const ny = Math.max(H * 0.42, Math.min(H * 0.78, lastRoof.y + (Math.random() - 0.5) * 110));
      const rx = lastRoof.x + lastRoof.w + gap;
      roofs.push({ x: rx, y: ny, w, h: H - ny + 80 });
      if (Math.random() < 0.75) coins.push({ x: rx + w * 0.5, y: ny - 46, taken: false });
      if (Math.random() < 0.55) drones.push({ x: rx + w * 0.65, y: ny - 32, r: 14, smashed: false });
    }
    if (roofs.length > 0 && roofs[0].x + roofs[0].w < -120) roofs.shift();

    for (const c of coins) {
      c.x -= curSpeed * dt;
      if (!c.taken && Math.abs(c.x - (runner.x + 13)) < 24 && Math.abs(c.y - (runner.y + 18)) < 28) {
        c.taken = true;
        credits++;
        bridgeAward(10, Math.floor(distance) + credits * 25, null);
      }
    }
    coins = coins.filter(c => c.x > -60 && !c.taken);

    for (const d of drones) {
      d.x -= (curSpeed + 45) * dt;
      if (!d.smashed && Math.abs(d.x - (runner.x + 13)) < 24 && Math.abs(d.y - (runner.y + 18)) < 26) {
        if (runner.dashTimer > 0) {
          d.smashed = true;
          credits += 2;
          bridgeAward(20, Math.floor(distance) + credits * 25, null);
          for (let i = 0; i < 12; i++) trails.push({ x: d.x, y: d.y, vx: (Math.random()-0.5)*220, vy: (Math.random()-0.5)*220, life: 0.4, color: '#FF6B8B' });
        } else {
          endRun();
          return;
        }
      }
    }
    drones = drones.filter(d => d.x > -60 && !d.smashed);

    if (runner.y > H + 50) {
      endRun();
      return;
    }

    if (Math.floor(distance) - lastSubmittedMilestone >= 150) {
      lastSubmittedMilestone = Math.floor(distance);
      bridgeAward(15, Math.floor(distance) + credits * 25, null);
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      const t = trails[i];
      t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt;
      if (t.life <= 0) trails.splice(i, 1);
    }

    updateHud();
  }

  function render() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1B112B');
    grad.addColorStop(1, '#311B3D');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Horizon sun
    ctx.beginPath();
    ctx.arc(W * 0.72, H * 0.32, 54, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 179, 71, 0.22)';
    ctx.fill();

    // Rooftops
    for (const r of roofs) {
      ctx.fillStyle = '#0F0B18';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = '#FFB347';
      ctx.fillRect(r.x, r.y, r.w, 4);
    }

    // Coins
    for (const c of coins) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#FFD166';
      ctx.fill();
    }

    // Drones
    for (const d of drones) {
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = '#FF5C7C';
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.fillRect(d.x - 5, d.y - 2, 10, 4);
    }

    // Runner
    if (runner) {
      ctx.fillStyle = runner.dashTimer > 0 ? '#FF8AA4' : '#FFF4E6';
      ctx.fillRect(runner.x, runner.y, runner.w, runner.h);
      ctx.fillStyle = '#FFB347';
      ctx.fillRect(runner.x + 14, runner.y + 8, 8, 5);
    }

    for (const t of trails) {
      ctx.globalAlpha = Math.max(0, t.life * 2.5);
      ctx.fillStyle = t.color;
      ctx.fillRect(t.x - 3, t.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
  }

  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    reset();
    running = true;
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
