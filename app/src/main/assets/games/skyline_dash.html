<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Skyline Dash</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #140F1C; color: #F7F2EB; font-family: system-ui, -apple-system, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font-family: monospace; font-size: 13px; }
  .pill { background: rgba(24, 18, 34, 0.84); border: 1px solid rgba(255, 179, 71, 0.45); padding: 6px 10px; border-radius: 999px; }
  .controls { position: absolute; bottom: 18px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
  .btn { pointer-events: auto; width: 88px; height: 64px; border-radius: 18px; background: rgba(28, 20, 40, 0.8); border: 1.5px solid rgba(255, 179, 71, 0.55); color: #FFC66D; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
  .btn:active { background: rgba(255, 179, 71, 0.3); transform: scale(0.95); }
  .btn-dash { border-color: rgba(255, 107, 139, 0.65); color: #FF8AA4; }
  #overlay { position: absolute; inset: 0; background: rgba(16, 11, 24, 0.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
  #overlay h1 { margin: 0; font-size: 28px; color: #FFB347; letter-spacing: 1.2px; }
  #overlay p { margin: 0; max-width: 320px; font-size: 14px; color: #D4C8DA; line-height: 1.45; }
  #startBtn { margin-top: 8px; padding: 12px 28px; border-radius: 999px; border: none; background: #FFB347; color: #19101F; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pill" id="distPill">0m</div>
    <div class="pill" id="comboPill">CREDITS 0</div>
    <div class="pill" id="bestPill">SPEED 1.0x</div>
  </div>
  <div class="controls">
    <button class="btn btn-dash" id="btnDash">DASH</button>
    <button class="btn" id="btnJump">JUMP</button>
  </div>
  <div id="overlay">
    <h1>SKYLINE DASH</h1>
    <p>High-tempo rooftop parkour. Double-jump across skyscraper gaps and trigger Air-Dash to smash through hover security drones.</p>
    <p style="font-size:12px;color:#A596B0;">Tap Jump / Dash or press Space / Shift</p>
    <button id="startBtn">START RUN</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const distPill = document.getElementById('distPill');
  const comboPill = document.getElementById('comboPill');
  const bestPill = document.getElementById('bestPill');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  let W = 800, H = 480;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  let running = false;
  let roofs = [], drones = [], coins = [], trails = [], ghosts = [];
  let runner, speed, distance, credits, lastSubmittedMilestone = 0, globalTime = 0, nextVictoryDist = 250;

  function playSfx(name) {
    try {
      if (window.VaultBridge && window.VaultBridge.playSfx) {
        window.VaultBridge.playSfx(name);
      }
    } catch (_) {}
  }

  function bridgeAward(xp, pts, achId) {
    try {
      if (window.VaultBridge) {
        if (xp > 0) window.VaultBridge.awardXp('skyline_dash', xp);
        if (pts > 0) window.VaultBridge.submitScore('skyline_dash', pts);
        if (achId) window.VaultBridge.unlockAchievement(achId);
      }
    } catch (_) {}
  }

  let hasResumableRun = false;
  let quickResumePending = false;
  let resumeSaveAccum = 0;

  function pushQuickResume(force) {
    if ((!hasResumableRun && !force) || !runner) return;
    try {
      if (window.VaultBridge && window.VaultBridge.saveQuickResume) {
        const curScore = Math.floor(distance) + credits * 25;
        const snap = {
          speed,
          distance,
          credits,
          lastSubmittedMilestone,
          nextVictoryDist,
          runner,
          roofs,
          coins,
          drones
        };
        const label = `${Math.floor(distance)}m · Score ${curScore}`;
        window.VaultBridge.saveQuickResume('skyline_dash', label, JSON.stringify(snap));
      }
    } catch (_) {}
  }

  function clearQuickResumeBridge() {
    hasResumableRun = false;
    quickResumePending = false;
    try {
      if (window.VaultBridge && window.VaultBridge.clearQuickResume) {
        window.VaultBridge.clearQuickResume('skyline_dash');
      }
    } catch (_) {}
  }

  function reset() {
    speed = 290;
    distance = 0;
    credits = 0;
    lastSubmittedMilestone = 0;
    nextVictoryDist = 250;
    const baseY = H * 0.68;
    roofs = [
      { x: 0, y: baseY, w: 460, h: H - baseY + 60 },
      { x: 540, y: baseY - 30, w: 320, h: H - baseY + 90 },
      { x: 940, y: baseY + 15, w: 360, h: H - baseY + 60 }
    ];
    drones = [];
    coins = [{ x: 340, y: baseY - 52, taken: false }, { x: 650, y: baseY - 82, taken: false }];
    trails = [];
    ghosts = [];
    runner = { x: 96, y: baseY - 40, w: 28, h: 40, vy: 0, jumps: 2, onGround: true, stride: 0, dashTimer: 0, dashCd: 0 };
    updateHud();
  }

  function doJump() {
    if (!running) return;
    if (runner.jumps > 0) {
      playSfx('JUMP');
      runner.vy = -465;
      runner.jumps--;
      runner.onGround = false;
      for (let i = 0; i < 6; i++) trails.push({ x: runner.x, y: runner.y + 34, vx: -80 - Math.random()*80, vy: (Math.random()-0.5)*90, life: 0.35, color: '#FFB347' });
    }
  }

  function doDash() {
    if (!running || runner.dashCd > 0) return;
    playSfx('DASH');
    runner.dashTimer = 0.26;
    runner.dashCd = 0.85;
    runner.vy = 0;
    for (let i = 0; i < 12; i++) trails.push({ x: runner.x, y: runner.y + 20, vx: -220 - Math.random()*120, vy: (Math.random()-0.5)*110, life: 0.42, color: '#FF6B8B' });
  }

  document.getElementById('btnJump').addEventListener('pointerdown', (e) => { e.preventDefault(); doJump(); });
  document.getElementById('btnDash').addEventListener('pointerdown', (e) => { e.preventDefault(); doDash(); });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') doJump();
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') doDash();
  });

  function updateHud() {
    const score = Math.floor(distance) + credits * 25;
    distPill.textContent = `${Math.floor(distance)}m`;
    comboPill.textContent = `SCORE ${score}`;
    bestPill.textContent = `SPEED ${(speed / 290).toFixed(1)}x`;
  }

  function endRun() {
    running = false;
    clearQuickResumeBridge();
    const finalScore = Math.floor(distance) + credits * 25;
    const earnedXp = Math.max(15, Math.floor(finalScore / 20));
    playSfx(finalScore >= 600 ? 'VICTORY' : 'HIT');
    bridgeAward(earnedXp, finalScore, finalScore >= 600 ? 'skyline_ace' : null);
    overlay.querySelector('h1').textContent = 'WIPEOUT';
    overlay.querySelector('p').textContent = `Covered ${Math.floor(distance)}m · Score ${finalScore}. +${earnedXp} XP synced to Vault.`;
    startBtn.textContent = 'RUN AGAIN';
    overlay.style.display = 'flex';
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.035);
    last = now;
    globalTime += dt;
    if (running) {
      update(dt);
      resumeSaveAccum += dt;
      if (resumeSaveAccum >= 0.85) {
        resumeSaveAccum = 0;
        pushQuickResume(false);
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    const curSpeed = runner.dashTimer > 0 ? speed * 1.9 : speed;
    speed = Math.min(540, speed + dt * 7.5);
    distance += (curSpeed * dt) / 16;

    if (runner.dashTimer > 0) {
      runner.dashTimer -= dt;
      ghosts.push({ x: runner.x, y: runner.y, life: 0.16 });
    }
    if (runner.dashCd > 0) runner.dashCd -= dt;

    if (runner.dashTimer <= 0) {
      runner.vy += 1160 * dt;
    }

    const prevBottom = runner.y + runner.h;
    runner.y += runner.vy * dt;
    runner.onGround = false;

    for (const r of roofs) {
      r.x -= curSpeed * dt;
      if (runner.x + runner.w > r.x + 2 && runner.x < r.x + r.w - 2) {
        if (runner.vy >= 0 && prevBottom <= r.y + 14 && runner.y + runner.h >= r.y) {
          runner.y = r.y - runner.h;
          runner.vy = 0;
          runner.jumps = 2;
          runner.onGround = true;
        }
      }
    }

    if (runner.onGround) {
      runner.stride += dt * (curSpeed / 22);
    }

    const lastRoof = roofs[roofs.length - 1];
    if (lastRoof.x + lastRoof.w < W + 260) {
      const gap = 85 + Math.random() * 95;
      const w = 220 + Math.random() * 240;
      const ny = Math.max(H * 0.42, Math.min(H * 0.78, lastRoof.y + (Math.random() - 0.5) * 110));
      const rx = lastRoof.x + lastRoof.w + gap;
      roofs.push({ x: rx, y: ny, w, h: H - ny + 80 });
      if (Math.random() < 0.75) coins.push({ x: rx + w * 0.5, y: ny - 46, taken: false });
      if (Math.random() < 0.55) drones.push({ x: rx + w * 0.65, y: ny - 32, r: 15, smashed: false });
    }
    if (roofs.length > 0 && roofs[0].x + roofs[0].w < -120) roofs.shift();

    for (const c of coins) {
      c.x -= curSpeed * dt;
      if (!c.taken && Math.abs(c.x - (runner.x + 14)) < 25 && Math.abs(c.y - (runner.y + 20)) < 30) {
        c.taken = true;
        credits++;
        playSfx('PICKUP');
        bridgeAward(10, Math.floor(distance) + credits * 25, null);
      }
    }
    coins = coins.filter(c => c.x > -60 && !c.taken);

    for (const d of drones) {
      d.x -= (curSpeed + 45) * dt;
      if (!d.smashed && Math.abs(d.x - (runner.x + 14)) < 26 && Math.abs(d.y - (runner.y + 20)) < 28) {
        if (runner.dashTimer > 0) {
          d.smashed = true;
          credits += 2;
          playSfx('HIT');
          bridgeAward(20, Math.floor(distance) + credits * 25, null);
          for (let i = 0; i < 14; i++) trails.push({ x: d.x, y: d.y, vx: (Math.random()-0.5)*240, vy: (Math.random()-0.5)*240, life: 0.45, color: '#FF6B8B' });
        } else {
          endRun();
          return;
        }
      }
    }
    drones = drones.filter(d => d.x > -60 && !d.smashed);

    if (runner.y > H + 50) {
      endRun();
      return;
    }

    if (distance >= nextVictoryDist) {
      nextVictoryDist += 250;
      playSfx('VICTORY');
    }

    if (Math.floor(distance) - lastSubmittedMilestone >= 150) {
      lastSubmittedMilestone = Math.floor(distance);
      bridgeAward(15, Math.floor(distance) + credits * 25, null);
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      const t = trails[i];
      t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt;
      if (t.life <= 0) trails.splice(i, 1);
    }
    for (let i = ghosts.length - 1; i >= 0; i--) {
      ghosts[i].x -= curSpeed * dt * 0.5;
      ghosts[i].life -= dt;
      if (ghosts[i].life <= 0) ghosts.splice(i, 1);
    }

    updateHud();
  }

  function drawParkourRunner(x, y, stride, dashing, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const cx = x + 14;
    const by = y + 40;

    // Billowing Runner Scarf with outline
    const wave = Math.sin(globalTime * 18) * 4;
    ctx.strokeStyle = dashing ? '#BE185D' : '#B45309';
    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + 2, y + 13);
    ctx.quadraticCurveTo(cx - 12, y + 12 + wave, cx - 26, y + 16 - wave);
    ctx.stroke();

    ctx.strokeStyle = dashing ? '#FF6B8B' : '#FFB347';
    ctx.lineWidth = 3.8;
    ctx.beginPath();
    ctx.moveTo(cx + 2, y + 13);
    ctx.quadraticCurveTo(cx - 12, y + 12 + wave, cx - 26, y + 16 - wave);
    ctx.stroke();

    // Sprinting / Air-Dash Legs + Sneakers
    const legSwing = dashing ? 0.9 : Math.sin(stride);
    const bFootX = cx - legSwing * 10;
    const fFootX = cx + (dashing ? 13 : legSwing * 10);
    const fFootY = dashing ? by - 10 : by - 2;

    ctx.strokeStyle = '#9D8CA8';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(cx, by - 14);
    ctx.lineTo(bFootX, by - 2);
    ctx.stroke();
    ctx.fillStyle = '#475569';
    ctx.fillRect(bFootX - 2, by - 3.5, 7, 3.5);

    ctx.strokeStyle = dashing ? '#FF8AA4' : '#FFF4E6';
    ctx.beginPath();
    ctx.moveTo(cx, by - 14);
    ctx.lineTo(fFootX, fFootY);
    ctx.stroke();
    ctx.fillStyle = dashing ? '#FF6B8B' : '#FFB347';
    ctx.fillRect(fFootX - 2, fFootY - 2.5, 8, 3.5);

    // Leaning Torso Jacket + Trim Stripe
    ctx.fillStyle = dashing ? '#FF5C7C' : '#FFF4E6';
    ctx.beginPath();
    ctx.moveTo(cx - 5.5, by - 27.5);
    ctx.lineTo(cx + 9.5, by - 27.5);
    ctx.lineTo(cx + 5.5, by - 13);
    ctx.lineTo(cx - 7.5, by - 13);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#19101F';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    // High Collar Accent
    ctx.fillStyle = dashing ? '#FFE4E6' : '#FFB347';
    ctx.fillRect(cx - 2, by - 27, 9, 2.5);

    // Pumping Arm
    ctx.strokeStyle = '#FFB347';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(cx + 3, by - 23);
    ctx.lineTo(cx + (dashing ? 16 : -legSwing * 8), by - 17);
    ctx.stroke();

    // Head + Visor + Hair Spike
    ctx.fillStyle = '#FFF4E6';
    ctx.beginPath();
    ctx.arc(cx + 5, by - 33, 7.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FF6B8B';
    ctx.beginPath();
    ctx.moveTo(cx - 2, by - 38);
    ctx.lineTo(cx - 9, by - 44);
    ctx.lineTo(cx + 4, by - 39.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#FFB347';
    ctx.fillRect(cx + 5, by - 35.5, 7.5, 4);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(cx + 8.5, by - 34.8, 3, 1.5);

    if (dashing && alpha === 1) {
      // Supersonic Dash Shockwave Cone
      ctx.strokeStyle = 'rgba(255, 107, 139, 0.85)';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(cx - 6, y);
      ctx.lineTo(cx + 27, y + 20);
      ctx.lineTo(cx - 6, y + 40);
      ctx.stroke();
    }
    ctx.restore();
  }

  function render() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1B112B');
    grad.addColorStop(1, '#311B3D');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Horizon sun + soft atmospheric bloom
    const sunGrad = ctx.createRadialGradient(W * 0.72, H * 0.32, 10, W * 0.72, H * 0.32, 95);
    sunGrad.addColorStop(0, 'rgba(255, 200, 87, 0.42)');
    sunGrad.addColorStop(1, 'rgba(255, 179, 71, 0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(W * 0.72, H * 0.32, 95, 0, Math.PI * 2);
    ctx.fill();

    // Distant Parallax Skyscraper Skyline with lit windows
    const skyShift = -((distance * 3) % 140);
    for (let sx = skyShift; sx < W + 140; sx += 70) {
      const bh = 80 + Math.abs(Math.sin(sx * 0.05)) * 120;
      const by = H - bh - 40;
      ctx.fillStyle = 'rgba(18, 12, 28, 0.72)';
      ctx.fillRect(sx, by, 56, bh + 40);
      ctx.fillStyle = 'rgba(255, 179, 71, 0.16)';
      for (let wy = by + 12; wy < H - 20; wy += 18) {
        ctx.fillRect(sx + 10, wy, 10, 6);
        ctx.fillRect(sx + 34, wy, 10, 6);
      }
    }

    // Beveled Rooftops with architectural ledge & windows
    for (const r of roofs) {
      ctx.fillStyle = '#0F0B18';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = '#1D142C';
      ctx.fillRect(r.x + 8, r.y + 18, r.w - 16, r.h - 18);
      ctx.fillStyle = '#FFB347';
      ctx.fillRect(r.x, r.y, r.w, 4.5);
      ctx.fillStyle = 'rgba(255, 179, 71, 0.18)';
      for (let wx = r.x + 20; wx < r.x + r.w - 28; wx += 36) {
        ctx.fillRect(wx, r.y + 26, 16, 10);
        ctx.fillRect(wx, r.y + 46, 16, 10);
      }
    }

    // Rotating Holo-Credits with shine
    for (const c of coins) {
      const spin = Math.abs(Math.cos(globalTime * 5 + c.x * 0.02));
      ctx.fillStyle = 'rgba(255, 209, 102, 0.25)';
      ctx.beginPath();
      ctx.arc(c.x, c.y, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFD166';
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, Math.max(3, 9 * spin), 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Animated Hover Security Drones
    for (const d of drones) {
      const bob = Math.sin(globalTime * 9 + d.x) * 3;
      const dy = d.y + bob;
      const rotorW = 14 + Math.sin(globalTime * 40) * 6;
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(d.x - rotorW, dy - 14);
      ctx.lineTo(d.x + rotorW, dy - 14);
      ctx.stroke();
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(d.x - 16, dy);
      ctx.lineTo(d.x - 8, dy - 11);
      ctx.lineTo(d.x + 8, dy - 11);
      ctx.lineTo(d.x + 16, dy);
      ctx.lineTo(d.x + 8, dy + 10);
      ctx.lineTo(d.x - 8, dy + 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = '#FF5C7C';
      ctx.beginPath();
      ctx.arc(d.x - 3, dy, 4.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFE4E6';
      ctx.beginPath();
      ctx.arc(d.x - 4.2, dy - 1.2, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Dash Afterimage Ghosts
    for (const g of ghosts) {
      drawParkourRunner(g.x, g.y, runner.stride, true, (g.life / 0.16) * 0.38);
    }

    // Main Animated Parkour Runner
    if (runner) {
      drawParkourRunner(runner.x, runner.y, runner.stride, runner.dashTimer > 0, 1);
    }

    for (const t of trails) {
      ctx.globalAlpha = Math.max(0, t.life * 2.5);
      ctx.fillStyle = t.color;
      ctx.fillRect(t.x - 3, t.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
  }

  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    if (quickResumePending) {
      quickResumePending = false;
      running = true;
      return;
    }
    reset();
    hasResumableRun = true;
    pushQuickResume(true);
    running = true;
  });

  window.VaultRequestQuickResume = () => {
    if (hasResumableRun) pushQuickResume(true);
  };

  window.VaultApplyQuickResume = (rawJson) => {
    try {
      const snap = JSON.parse(rawJson);
      speed = snap.speed || 290;
      distance = snap.distance || 0;
      credits = snap.credits || 0;
      lastSubmittedMilestone = snap.lastSubmittedMilestone || 0;
      nextVictoryDist = snap.nextVictoryDist || 250;
      if (Array.isArray(snap.roofs) && snap.roofs.length > 0) roofs = snap.roofs;
      if (Array.isArray(snap.coins)) coins = snap.coins;
      if (Array.isArray(snap.drones)) drones = snap.drones;
      if (snap.runner) runner = snap.runner;
      hasResumableRun = true;
      quickResumePending = true;
      updateHud();
      const s = Math.floor(distance) + credits * 25;
      overlay.querySelector('h1').textContent = 'QUICK RESUME';
      overlay.querySelector('p').textContent = `Restored at ${Math.floor(distance)}m · Score ${s} · Speed ${(speed / 290).toFixed(1)}x. Tap below when ready!`;
      startBtn.textContent = 'RESUME RUN';
      overlay.style.display = 'flex';
    } catch (_) {}
  };

  window.addEventListener('pagehide', () => { if (hasResumableRun) pushQuickResume(true); });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
