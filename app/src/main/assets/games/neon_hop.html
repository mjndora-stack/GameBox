<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Neon Hop</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0E14; color: #E8EEF5; font-family: system-ui, -apple-system, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; pointer-events: none; font-family: monospace; font-size: 12px; }
  .hud-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pill { background: rgba(16, 22, 32, 0.86); border: 1px solid rgba(72, 240, 210, 0.35); padding: 5px 10px; border-radius: 999px; letter-spacing: 0.4px; white-space: nowrap; }
  .pill-btn { pointer-events: auto; cursor: pointer; background: rgba(20, 30, 44, 0.92); border: 1px solid rgba(92, 242, 214, 0.55); color: #7CF7E1; font-weight: 700; }
  .pill-btn:active { transform: scale(0.95); background: rgba(92, 242, 214, 0.25); }
  .controls { position: absolute; bottom: 16px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .group { display: flex; gap: 10px; pointer-events: auto; }
  .btn { width: 62px; height: 62px; border-radius: 16px; background: rgba(20, 28, 40, 0.78); border: 1.5px solid rgba(72, 240, 210, 0.45); color: #7CF7E1; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .btn:active, .btn.active { background: rgba(72, 240, 210, 0.28); transform: scale(0.95); }
  .btn-jump { width: 78px; height: 64px; border-color: rgba(168, 255, 96, 0.65); color: #B8FF78; font-size: 14px; letter-spacing: 0.6px; }
  #overlay { position: absolute; inset: 0; background: rgba(9, 12, 18, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 18px; overflow-y: auto; touch-action: pan-y; }
  #overlay h1 { margin: 0; font-size: 26px; letter-spacing: 1.2px; color: #5CF2D6; }
  #overlay p { margin: 0; max-width: 380px; font-size: 13px; color: #9FB0C4; line-height: 1.4; }
  .stage-bar { display: flex; align-items: center; gap: 8px; background: rgba(18, 26, 38, 0.9); border: 1px solid rgba(92, 242, 214, 0.35); border-radius: 14px; padding: 8px 12px; }
  .step-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(92, 242, 214, 0.45); background: #142030; color: #5CF2D6; font-weight: 700; font-size: 16px; cursor: pointer; }
  .step-btn:active { transform: scale(0.94); }
  .stage-label { min-width: 175px; font-family: monospace; font-size: 12px; font-weight: 700; color: #E8EEF5; }
  .stage-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 390px; width: 100%; max-height: 148px; overflow-y: auto; touch-action: pan-y; padding: 6px; background: rgba(13, 18, 28, 0.85); border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 12px; }
  .sg-btn { padding: 6px 0; border-radius: 7px; border: 1px solid rgba(148, 163, 184, 0.25); background: #162030; color: #CBD5E1; font-family: monospace; font-size: 11px; font-weight: 700; cursor: pointer; }
  .sg-btn.selected { background: #5CF2D6; color: #071316; border-color: #5CF2D6; }
  .sg-btn.cleared { border-color: rgba(184, 255, 120, 0.6); color: #B8FF78; }
  .sg-btn.selected.cleared { background: #5CF2D6; color: #071316; }
  .quick-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .quick-btn { padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(167, 139, 250, 0.45); background: rgba(25, 22, 46, 0.85); color: #DDD6FE; font-family: monospace; font-size: 11px; cursor: pointer; }
  #startBtn { margin-top: 4px; padding: 12px 30px; border-radius: 999px; border: none; background: #5CF2D6; color: #071316; font-weight: 800; font-size: 14px; cursor: pointer; letter-spacing: 0.6px; }
  #toast { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(10, 18, 28, 0.92); border: 1.5px solid #5CF2D6; color: #E8EEF5; padding: 7px 16px; border-radius: 999px; font-family: monospace; font-size: 12px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity 0.25s ease; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="hud-group">
      <div class="pill" id="stagePill">STAGE 1/50+</div>
      <div class="pill" id="zonePill">SECTOR A</div>
    </div>
    <div class="hud-group">
      <div class="pill" id="scorePill">SCORE 0 · ORBS 0</div>
      <div class="pill" id="livesPill">HP 3</div>
      <button class="pill pill-btn" id="stageMenuBtn" type="button">STAGES</button>
    </div>
  </div>
  <div id="toast">SECTOR CLEARED!</div>
  <div class="controls" id="touchControls">
    <div class="group">
      <button class="btn" id="btnLeft" aria-label="Move Left">◀</button>
      <button class="btn" id="btnRight" aria-label="Move Right">▶</button>
    </div>
    <div class="group">
      <button class="btn btn-jump" id="btnJump" aria-label="Jump">JUMP</button>
    </div>
  </div>
  <div id="overlay">
    <h1>NEON HOP</h1>
    <p id="overlayDesc">50 curated cyber sectors + Endless Infinity Mode (Stages 51+). Bounce on neon pads, cross crumbling bridges, dodge patrol drones, and reach every warp gate.</p>
    <div class="stage-bar">
      <button class="step-btn" id="prevStageBtn" type="button">◀</button>
      <div class="stage-label" id="selectedStageLabel">STAGE 1 · BOOTSTRAP</div>
      <button class="step-btn" id="nextStageBtn" type="button">▶</button>
    </div>
    <div class="stage-grid" id="stageGrid"></div>
    <div class="quick-row">
      <button class="quick-btn" id="jumpEndlessBtn" type="button">∞ ENDLESS SECTOR 51+</button>
      <button class="quick-btn" id="jumpBestBtn" type="button">BEST STAGE: 1</button>
    </div>
    <button id="startBtn" type="button">LAUNCH STAGE 1</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stagePill = document.getElementById('stagePill');
  const zonePill = document.getElementById('zonePill');
  const scorePill = document.getElementById('scorePill');
  const livesPill = document.getElementById('livesPill');
  const stageMenuBtn = document.getElementById('stageMenuBtn');
  const overlay = document.getElementById('overlay');
  const overlayDesc = document.getElementById('overlayDesc');
  const startBtn = document.getElementById('startBtn');
  const prevStageBtn = document.getElementById('prevStageBtn');
  const nextStageBtn = document.getElementById('nextStageBtn');
  const selectedStageLabel = document.getElementById('selectedStageLabel');
  const stageGrid = document.getElementById('stageGrid');
  const jumpEndlessBtn = document.getElementById('jumpEndlessBtn');
  const jumpBestBtn = document.getElementById('jumpBestBtn');
  const toastEl = document.getElementById('toast');

  let W = 800, H = 480;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const keys = { left: false, right: false, jump: false };
  let jumpPressedEdge = false;

  function bindBtn(id, key) {
    const el = document.getElementById(id);
    const down = (e) => { e.preventDefault(); if (key === 'jump' && !keys.jump) jumpPressedEdge = true; keys[key] = true; el.classList.add('active'); };
    const up = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  }
  bindBtn('btnLeft', 'left');
  bindBtn('btnRight', 'right');
  bindBtn('btnJump', 'jump');

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!keys.jump) jumpPressedEdge = true;
      keys.jump = true;
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
  });

  const ZONES = [
    { label: 'CYAN GRID', bg: '#0B0E14', grid: 'rgba(92, 242, 214, 0.06)', accent: '#5CF2D6', mover: '#B8FF78', pad: '#38BDF8', crumble: '#FBBF24' },
    { label: 'SOLAR AMBER', bg: '#110D16', grid: 'rgba(255, 179, 71, 0.07)', accent: '#FFB347', mover: '#5CF2D6', pad: '#B8FF78', crumble: '#FB7185' },
    { label: 'CRIMSON CORE', bg: '#140B13', grid: 'rgba(255, 92, 124, 0.07)', accent: '#FF7A95', mover: '#FACC15', pad: '#5CF2D6', crumble: '#C084FC' },
    { label: 'VIOLET SPIRE', bg: '#0F0B1B', grid: 'rgba(167, 139, 250, 0.07)', accent: '#A78BFA', mover: '#5CF2D6', pad: '#FACC15', crumble: '#FB923C' },
    { label: 'EMERALD PULSE', bg: '#091311', grid: 'rgba(184, 255, 120, 0.06)', accent: '#B8FF78', mover: '#38BDF8', pad: '#FFB347', crumble: '#F472B6' },
    { label: 'PRISM NEXUS', bg: '#09101D', grid: 'rgba(56, 189, 248, 0.07)', accent: '#38BDF8', mover: '#B8FF78', pad: '#FF7A95', crumble: '#FDE047' }
  ];

  const SECTOR_NAMES = [
    'BOOTSTRAP', 'SKY BRIDGE', 'PLASMA CROSSING', 'PULSE STEPS', 'GLIDE CIRCUIT',
    'PHASE WALK', 'SPRINGBOARD', 'DOUBLE LIFT', 'CRUMBLE RUN', 'VECTOR RIDGE',
    'SOLAR ASCENT', 'AMBER GAP', 'DRONE ALLEY', 'SKYWAY ARCH', 'SOLAR VAULT',
    'TURBINE DECK', 'EMBER FALLS', 'HEAT SYNC', 'REACTOR RIM', 'SPIKE GAUNTLET',
    'CRIMSON ELEVATOR', 'LASER CANYON', 'PHASE LAB', 'CORE HOP', 'VIOLET TOWER',
    'DRIFT MATRIX', 'ECHO LEDGE', 'NEBULA CATWALK', 'APEX BOUNCE', 'SHARD RUN',
    'ORBIT RELAY', 'TWILIGHT SPIRE', 'EMERALD GRID', 'BIO CONDUIT', 'KINETIC PATH',
    'FLUX SWITCH', 'ZENITH BRIDGE', 'HYPER SPRING', 'ION CORRIDOR', 'PHOTON DRIFT',
    'PRISM GATE', 'QUANTUM STEP', 'AETHER ARCH', 'STARLIGHT LIFT', 'CHRONO RAIL',
    'NOVA TRIAL', 'APEX GAUNTLET', 'TITAN SKYLINE', 'SINGULARITY', 'OMEGA NEXUS'
  ];

  function mulberry32(seed) {
    let t = seed >>> 0;
    return () => {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Handcrafted opening 3 Fan Favourite stages
  const BASE_STAGES = [
    {
      name: SECTOR_NAMES[0],
      spawn: [60, 260],
      goal: [1520, 160],
      platforms: [
        { x: 0, y: 340, w: 260, h: 24 },
        { x: 310, y: 300, w: 150, h: 18 },
        { x: 520, y: 250, w: 140, h: 18, vx: 70, minX: 490, maxX: 640 },
        { x: 740, y: 290, w: 190, h: 20 },
        { x: 990, y: 240, w: 150, h: 18 },
        { x: 1190, y: 190, w: 130, h: 18, vy: 55, minY: 160, maxY: 270 },
        { x: 1380, y: 210, w: 220, h: 24 }
      ],
      spikes: [
        { x: 810, y: 274, w: 40, h: 16 },
        { x: 1050, y: 224, w: 32, h: 16 }
      ],
      drones: [],
      orbs: [
        [170, 290], [380, 250], [585, 200], [830, 220], [1065, 175], [1255, 130], [1450, 165]
      ]
    },
    {
      name: SECTOR_NAMES[1],
      spawn: [50, 300],
      goal: [1760, 130],
      platforms: [
        { x: 0, y: 360, w: 200, h: 24 },
        { x: 250, y: 315, w: 120, h: 18 },
        { x: 430, y: 270, w: 110, h: 18, vx: 95, minX: 410, maxX: 590 },
        { x: 670, y: 225, w: 130, h: 18 },
        { x: 860, y: 290, w: 210, h: 20 },
        { x: 1130, y: 250, w: 110, h: 18, vy: 75, minY: 160, maxY: 290 },
        { x: 1310, y: 195, w: 160, h: 18 },
        { x: 1530, y: 175, w: 290, h: 24 }
      ],
      spikes: [
        { x: 920, y: 274, w: 42, h: 16 },
        { x: 990, y: 274, w: 34, h: 16 },
        { x: 1380, y: 179, w: 36, h: 16 }
      ],
      drones: [],
      orbs: [
        [130, 315], [305, 265], [510, 210], [735, 175], [960, 215], [1185, 145], [1390, 125], [1640, 125]
      ]
    },
    {
      name: SECTOR_NAMES[2],
      spawn: [50, 310],
      goal: [1950, 120],
      platforms: [
        { x: 0, y: 370, w: 170, h: 24 },
        { x: 230, y: 320, w: 100, h: 16, vx: 85, minX: 210, maxX: 330 },
        { x: 440, y: 270, w: 110, h: 16 },
        { x: 620, y: 220, w: 100, h: 16, vy: 85, minY: 150, maxY: 280 },
        { x: 800, y: 250, w: 200, h: 18 },
        { x: 1070, y: 210, w: 110, h: 16, vx: 115, minX: 1040, maxX: 1230 },
        { x: 1340, y: 180, w: 130, h: 16 },
        { x: 1540, y: 230, w: 150, h: 18 },
        { x: 1760, y: 170, w: 260, h: 24 }
      ],
      spikes: [
        { x: 860, y: 234, w: 38, h: 16 },
        { x: 930, y: 234, w: 38, h: 16 },
        { x: 1600, y: 214, w: 42, h: 16 }
      ],
      drones: [],
      orbs: [
        [110, 320], [285, 260], [495, 220], [670, 145], [900, 175], [1150, 150], [1400, 130], [1615, 155], [1860, 120]
      ]
    }
  ];

  // Deterministic, physics-verified cyber sector builder for Stages 4..50 & Endless 51+
  function buildStage(stageNum) {
    if (stageNum <= BASE_STAGES.length) {
      const base = BASE_STAGES[stageNum - 1];
      return {
        ...base,
        zone: ZONES[0]
      };
    }

    const rand = mulberry32(stageNum * 9973 + 1337);
    const tier = Math.min(1, (stageNum - 3) / 47);
    const zoneIdx = Math.floor(((stageNum - 1) / 8)) % ZONES.length;
    const zone = ZONES[zoneIdx];
    const name = stageNum <= SECTOR_NAMES.length
      ? SECTOR_NAMES[stageNum - 1]
      : `ENDLESS SECTOR ${stageNum}`;

    const segCount = Math.min(18, 7 + Math.floor(stageNum / 4));
    const platforms = [];
    const spikes = [];
    const drones = [];
    const orbs = [];

    let curX = 0;
    let curY = 345;
    const startW = 190;
    platforms.push({ x: curX, y: curY, w: startW, h: 24 });
    orbs.push([curX + startW * 0.65, curY - 48]);

    let prevRight = curX + startW;
    let prevY = curY;
    let prevWasPad = false;

    for (let i = 0; i < segCount; i++) {
      const gap = prevWasPad
        ? 95 + rand() * 75
        : 60 + rand() * (72 + tier * 35); // well within 245px/s double-jump reach
      const maxClimb = prevWasPad ? -145 : -88;
      const deltaY = maxClimb + rand() * (prevWasPad ? 160 : 170);
      let nextY = Math.max(125, Math.min(390, prevY + deltaY));
      const w = Math.round(92 + rand() * (110 - tier * 24));
      const nextX = Math.round(prevRight + gap);

      const roll = rand();
      const canPad = stageNum >= 5 && !prevWasPad && i < segCount - 1 && roll < 0.16;
      const canCrumble = stageNum >= 6 && !canPad && roll >= 0.16 && roll < (0.16 + 0.14 + tier * 0.12);
      const canMoveH = !canPad && !canCrumble && roll >= 0.42 && roll < 0.60;
      const canMoveV = !canPad && !canCrumble && !canMoveH && roll >= 0.60 && roll < 0.74;

      const plat = { x: nextX, y: Math.round(nextY), w, h: 18 };
      let effectiveRight = nextX + w;

      if (canPad) {
        plat.pad = true;
        prevWasPad = true;
      } else {
        prevWasPad = false;
      }

      if (canCrumble) {
        plat.crumble = true;
      }

      if (canMoveH) {
        const travel = Math.round(45 + rand() * (55 + tier * 35));
        plat.vx = Math.round(68 + tier * 58);
        plat.minX = nextX - 10;
        plat.maxX = nextX + travel;
        effectiveRight = plat.maxX + w * 0.4; // ensures next jump stays comfortable even mid-cycle
      } else if (canMoveV) {
        const span = Math.round(50 + rand() * 45);
        plat.vy = Math.round(52 + tier * 48);
        plat.minY = Math.max(115, plat.y - Math.round(span * 0.5));
        plat.maxY = Math.min(400, plat.y + Math.round(span * 0.5));
      }

      platforms.push(plat);

      // Safe collectible orb
      orbs.push([
        Math.round(nextX + w * 0.5),
        Math.round((canMoveV ? plat.minY : plat.y) - (canPad ? 92 : 46))
      ]);

      // Plasma spikes only on wide static non-crumble, non-pad platforms
      if (!canMoveH && !canMoveV && !canCrumble && !canPad && w >= 158 && rand() < (0.36 + tier * 0.25)) {
        const sw = w >= 190 ? 38 : 30;
        spikes.push({
          x: Math.round(nextX + w * 0.5 - sw * 0.5),
          y: plat.y - 16,
          w: sw,
          h: 16
        });
      }

      // Patrol plasma drones starting from Stage 10+
      if (stageNum >= 10 && i > 0 && i < segCount - 1 && rand() < (0.18 + tier * 0.28)) {
        const dy = Math.max(85, plat.y - 78 - Math.round(rand() * 25));
        const dx = nextX + Math.round(w * 0.5);
        drones.push({
          x: dx,
          y: dy,
          baseX: dx,
          baseY: dy,
          r: 11,
          ampX: canMoveH ? 0 : 32 + Math.round(rand() * 24),
          ampY: canMoveV ? 0 : 18 + Math.round(rand() * 14),
          speed: 1.8 + tier * 1.4,
          phase: rand() * Math.PI * 2
        });
      }

      prevRight = effectiveRight;
      prevY = plat.y;
    }

    // Final goal dock
    const goalGap = 72 + rand() * 52;
    const goalY = Math.max(135, Math.min(350, Math.round(prevY - 30 + rand() * 50)));
    const goalX = Math.round(prevRight + goalGap);
    const goalW = 240;
    platforms.push({ x: goalX, y: goalY, w: goalW, h: 24 });
    orbs.push([goalX + 65, goalY - 46]);

    return {
      name,
      zone,
      spawn: [55, 265],
      goal: [goalX + goalW - 72, goalY - 44],
      platforms,
      spikes,
      drones,
      orbs
    };
  }

  const TOTAL_CURATED = 50;
  let selectedStageNum = 1;
  let bestStageNum = 1;
  const clearedStages = new Set();

  try {
    const savedBest = parseInt(localStorage.getItem('neon_hop_best_stage') || '1', 10);
    if (!isNaN(savedBest) && savedBest >= 1) bestStageNum = savedBest;
    const savedCleared = JSON.parse(localStorage.getItem('neon_hop_cleared') || '[]');
    if (Array.isArray(savedCleared)) savedCleared.forEach(n => clearedStages.add(n));
  } catch (_) {}

  function saveProgress(stageCleared) {
    if (stageCleared) clearedStages.add(stageCleared);
    if (currentStageNum > bestStageNum) bestStageNum = currentStageNum;
    try {
      localStorage.setItem('neon_hop_best_stage', String(bestStageNum));
      localStorage.setItem('neon_hop_cleared', JSON.stringify(Array.from(clearedStages)));
    } catch (_) {}
    jumpBestBtn.textContent = `BEST STAGE: ${bestStageNum}`;
  }

  function renderStageGrid() {
    stageGrid.innerHTML = '';
    for (let s = 1; s <= TOTAL_CURATED; s++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'sg-btn' + (s === selectedStageNum ? ' selected' : '') + (clearedStages.has(s) ? ' cleared' : '');
      b.textContent = String(s);
      b.addEventListener('click', () => {
        selectedStageNum = s;
        syncStageSelectorUI();
      });
      stageGrid.appendChild(b);
    }
  }

  function syncStageSelectorUI() {
    const info = buildStage(selectedStageNum);
    selectedStageLabel.textContent = selectedStageNum <= TOTAL_CURATED
      ? `STAGE ${selectedStageNum} · ${info.name}`
      : `STAGE ${selectedStageNum} · ENDLESS ∞`;
    startBtn.textContent = `LAUNCH STAGE ${selectedStageNum}`;
    jumpBestBtn.textContent = `BEST STAGE: ${bestStageNum}`;
    renderStageGrid();
  }

  prevStageBtn.addEventListener('click', () => {
    selectedStageNum = Math.max(1, selectedStageNum - 1);
    syncStageSelectorUI();
  });
  nextStageBtn.addEventListener('click', () => {
    selectedStageNum += 1;
    syncStageSelectorUI();
  });
  jumpEndlessBtn.addEventListener('click', () => {
    selectedStageNum = Math.max(51, bestStageNum > 50 ? bestStageNum : 51);
    syncStageSelectorUI();
  });
  jumpBestBtn.addEventListener('click', () => {
    selectedStageNum = bestStageNum;
    syncStageSelectorUI();
  });

  let running = false;
  let currentStageNum = 1;
  let currentStage = null;
  let score = 0;
  let totalOrbs = 0;
  let hp = 3;
  let camX = 0;
  let globalTime = 0;
  let toastTimer = 0;
  let player, platforms, spikes, drones, orbs, goal, particles = [];

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    toastTimer = 2.0;
  }

  function playSfx(name) {
    try {
      if (window.VaultBridge && window.VaultBridge.playSfx) {
        window.VaultBridge.playSfx(name);
      }
    } catch (_) {}
  }

  function bridgeAward(xp, pts, achId) {
    try {
      if (window.VaultBridge) {
        if (xp > 0) window.VaultBridge.awardXp('neon_hop', xp);
        if (pts > 0) window.VaultBridge.submitScore('neon_hop', pts);
        if (achId) window.VaultBridge.unlockAchievement(achId);
      }
    } catch (_) {}
  }

  let hasResumableProgress = false;
  let quickResumePending = false;
  let resumeSaveAccum = 0;

  function pushQuickResume(force) {
    if (!hasResumableProgress && !force) return;
    if (!player || !currentStage || hp <= 0) return;
    try {
      if (window.VaultBridge && window.VaultBridge.saveQuickResume) {
        const snap = {
          stageNum: currentStageNum,
          score,
          totalOrbs,
          hp,
          px: Math.round(player.x),
          py: Math.round(player.y),
          facing: player.facing,
          collected: orbs.map(o => o.collected)
        };
        const label = `Stage ${currentStageNum} · Score ${score} · HP ${hp}`;
        window.VaultBridge.saveQuickResume('neon_hop', label, JSON.stringify(snap));
      }
    } catch (_) {}
  }

  function clearQuickResumeBridge() {
    hasResumableProgress = false;
    quickResumePending = false;
    try {
      if (window.VaultBridge && window.VaultBridge.clearQuickResume) {
        window.VaultBridge.clearQuickResume('neon_hop');
      }
    } catch (_) {}
  }

  function loadStage(stageNum) {
    currentStageNum = stageNum;
    selectedStageNum = stageNum;
    currentStage = buildStage(stageNum);
    platforms = currentStage.platforms.map(p => ({
      ...p,
      baseW: p.w,
      crumbleTimer: -1,
      respawnTimer: 0,
      broken: false
    }));
    spikes = currentStage.spikes.map(sp => ({ ...sp }));
    drones = currentStage.drones.map(d => ({ ...d }));
    orbs = currentStage.orbs.map(([x, y]) => ({ x, y, collected: false, bob: Math.random() * 6 }));
    goal = { x: currentStage.goal[0], y: currentStage.goal[1] };
    player = {
      x: currentStage.spawn[0], y: currentStage.spawn[1], w: 26, h: 36,
      vx: 0, vy: 0, facing: 1, onGround: false, jumpsLeft: 2, invuln: 0,
      runPhase: 0, squash: 1, scarfPts: [
        { x: currentStage.spawn[0], y: currentStage.spawn[1] + 10 },
        { x: currentStage.spawn[0] - 8, y: currentStage.spawn[1] + 12 },
        { x: currentStage.spawn[0] - 16, y: currentStage.spawn[1] + 14 }
      ]
    };
    particles = [];
    camX = 0;
    updateHud();
  }

  function updateHud() {
    stagePill.textContent = currentStageNum <= TOTAL_CURATED
      ? `STAGE ${currentStageNum}/${TOTAL_CURATED}`
      : `ENDLESS ${currentStageNum}`;
    zonePill.textContent = `${currentStage.zone.label}`;
    scorePill.textContent = `SCORE ${score} · ORBS ${totalOrbs}`;
    livesPill.textContent = `HP ${hp}`;
  }

  function spawnBurst(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 140;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, maxLife: 0.45, color });
    }
  }

  function hitPlayer() {
    if (player.invuln > 0) return;
    playSfx('HIT');
    hp -= 1;
    spawnBurst(player.x + 13, player.y + 18, '#FF5C7C', 16);
    if (hp <= 0) {
      running = false;
      clearQuickResumeBridge();
      saveProgress(null);
      bridgeAward(20, score, null);
      overlay.querySelector('h1').textContent = 'RUN ENDED';
      overlayDesc.textContent = `Reached Stage ${currentStageNum} · Score ${score} · Cores ${totalOrbs}. Pick any stage below to launch again.`;
      syncStageSelectorUI();
      overlay.style.display = 'flex';
      score = 0; totalOrbs = 0; hp = 3;
      return;
    }
    // Restore any crumbled platforms on respawn
    for (const p of platforms) {
      p.broken = false; p.crumbleTimer = -1; p.respawnTimer = 0;
    }
    const sp = currentStage.spawn;
    player.x = sp[0]; player.y = sp[1]; player.vx = 0; player.vy = 0; player.invuln = 1.2;
    updateHud();
    pushQuickResume(true);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.035);
    last = now;
    globalTime += dt;
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) toastEl.style.opacity = '0';
    }
    if (running) {
      update(dt);
      resumeSaveAccum += dt;
      if (resumeSaveAccum >= 0.9) {
        resumeSaveAccum = 0;
        pushQuickResume(false);
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    for (const p of platforms) {
      p.dx = 0; p.dy = 0;
      if (p.crumble) {
        if (p.broken) {
          p.respawnTimer -= dt;
          if (p.respawnTimer <= 0) {
            p.broken = false;
            p.crumbleTimer = -1;
          }
        } else if (p.crumbleTimer >= 0) {
          p.crumbleTimer -= dt;
          if (p.crumbleTimer <= 0) {
            p.broken = true;
            p.respawnTimer = 2.2;
            spawnBurst(p.x + p.w * 0.5, p.y + 8, currentStage.zone.crumble, 8);
          }
        }
      }
      if (p.vx) {
        const prev = p.x;
        p.x += p.vx * dt;
        if (p.x < p.minX) { p.x = p.minX; p.vx *= -1; }
        if (p.x > p.maxX) { p.x = p.maxX; p.vx *= -1; }
        p.dx = p.x - prev;
      }
      if (p.vy) {
        const prev = p.y;
        p.y += p.vy * dt;
        if (p.y < p.minY) { p.y = p.minY; p.vy *= -1; }
        if (p.y > p.maxY) { p.y = p.maxY; p.vy *= -1; }
        p.dy = p.y - prev;
      }
    }

    for (const d of drones) {
      d.phase += dt * d.speed;
      d.x = d.baseX + Math.sin(d.phase) * d.ampX;
      d.y = d.baseY + Math.cos(d.phase * 1.3) * d.ampY;
    }

    const moveSpeed = 245;
    if (keys.left) { player.vx = -moveSpeed; player.facing = -1; }
    else if (keys.right) { player.vx = moveSpeed; player.facing = 1; }
    else player.vx *= 0.78;

    if (jumpPressedEdge && player.jumpsLeft > 0) {
      playSfx('JUMP');
      player.vy = -445;
      player.jumpsLeft--;
      player.onGround = false;
      player.squash = 1.22;
      spawnBurst(player.x + 13, player.y + 34, player.jumpsLeft === 0 ? currentStage.zone.mover : currentStage.zone.accent, 8);
    }
    jumpPressedEdge = false;

    player.vy += 1080 * dt;
    if (player.vy > 680) player.vy = 680;

    player.x += player.vx * dt;
    if (player.x < 0) player.x = 0;

    const wasOnGround = player.onGround;
    const prevBottom = player.y + player.h;
    player.y += player.vy * dt;
    player.onGround = false;

    for (const p of platforms) {
      if (p.broken) continue;
      if (player.x + player.w > p.x + 2 && player.x < p.x + p.w - 2) {
        if (player.vy >= 0 && prevBottom <= p.y + 12 && player.y + player.h >= p.y) {
          player.y = p.y - player.h;
          player.x += (p.dx || 0);
          if (p.pad) {
            playSfx('JUMP');
            player.vy = -615;
            player.onGround = false;
            player.jumpsLeft = 1;
            player.squash = 1.3;
            spawnBurst(player.x + 13, p.y, currentStage.zone.pad, 12);
          } else {
            player.vy = 0;
            player.onGround = true;
            player.jumpsLeft = 2;
            if (!wasOnGround) player.squash = 0.78;
            if (p.crumble && p.crumbleTimer < 0) {
              p.crumbleTimer = 0.65;
            }
          }
        }
      }
    }

    player.squash += (1 - player.squash) * 0.18;
    if (player.onGround && Math.abs(player.vx) > 25) {
      player.runPhase += dt * 15;
    }

    const anchorX = player.x + 13 - player.facing * 4;
    const anchorY = player.y + 13;
    player.scarfPts[0].x = anchorX;
    player.scarfPts[0].y = anchorY;
    for (let i = 1; i < player.scarfPts.length; i++) {
      const prev = player.scarfPts[i - 1];
      const cur = player.scarfPts[i];
      cur.x += (prev.x - player.facing * 7 - cur.x) * 0.35;
      cur.y += (prev.y + 2 + Math.sin(globalTime * 14 + i) * 2.2 - cur.y) * 0.35;
    }

    if (player.invuln > 0) player.invuln -= dt;
    if (player.y > 540) hitPlayer();

    for (const s of spikes) {
      if (player.x + player.w - 4 > s.x && player.x + 4 < s.x + s.w && player.y + player.h > s.y + 2 && player.y < s.y + s.h) {
        hitPlayer();
        break;
      }
    }

    for (const d of drones) {
      const dx = (player.x + 13) - d.x;
      const dy = (player.y + 18) - d.y;
      if (dx * dx + dy * dy < (d.r + 11) * (d.r + 11)) {
        hitPlayer();
        break;
      }
    }

    for (const o of orbs) {
      o.bob += dt * 4;
      if (!o.collected) {
        const dx = (player.x + 13) - o.x;
        const dy = (player.y + 18) - o.y;
        if (dx * dx + dy * dy < 26 * 26) {
          o.collected = true;
          totalOrbs++;
          score += 50;
          playSfx('PICKUP');
          spawnBurst(o.x, o.y, '#B8FF78', 10);
          bridgeAward(15, score, totalOrbs >= 10 ? 'platform_pioneer' : null);
          updateHud();
        }
      }
    }

    const gx = goal.x, gy = goal.y;
    if (Math.abs((player.x + 13) - gx) < 28 && Math.abs((player.y + 18) - gy) < 36) {
      playSfx('VICTORY');
      score += 250 + currentStageNum * 15;
      if (hp < 3) hp = Math.min(3, hp + 1); // heal 1 HP between sectors
      saveProgress(currentStageNum);
      bridgeAward(80, score, 'neon_finisher');
      spawnBurst(gx, gy, currentStage.zone.accent, 24);
      const nextNum = currentStageNum + 1;
      showToast(`STAGE ${currentStageNum} CLEARED · NEXT: ${nextNum <= TOTAL_CURATED ? SECTOR_NAMES[nextNum - 1] : 'ENDLESS ' + nextNum}`);
      loadStage(nextNum);
      pushQuickResume(true);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    const targetCam = Math.max(0, player.x - W * 0.35);
    camX += (targetCam - camX) * 0.14;
  }

  function drawCyberRunner() {
    if (player.invuln > 0 && Math.floor(player.invuln * 16) % 2 === 0) return;

    // Animated billowing scarf with dark outline contrast
    ctx.strokeStyle = '#9D174D';
    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(player.scarfPts[0].x, player.scarfPts[0].y);
    ctx.lineTo(player.scarfPts[1].x, player.scarfPts[1].y);
    ctx.lineTo(player.scarfPts[2].x, player.scarfPts[2].y);
    ctx.stroke();

    ctx.strokeStyle = '#FF5C7C';
    ctx.lineWidth = 3.8;
    ctx.beginPath();
    ctx.moveTo(player.scarfPts[0].x, player.scarfPts[0].y);
    ctx.lineTo(player.scarfPts[1].x, player.scarfPts[1].y);
    ctx.lineTo(player.scarfPts[2].x, player.scarfPts[2].y);
    ctx.stroke();

    const cx = player.x + player.w * 0.5;
    const by = player.y + player.h;
    const stride = player.onGround ? Math.sin(player.runPhase) : 0.75;
    const sy = player.squash;
    const sx = 2 - sy;

    ctx.save();
    ctx.translate(cx, by);
    ctx.scale(sx, sy);

    // Back leg + boot
    const bFootX = -4 - stride * 7.5 * player.facing;
    const bFootY = player.onGround ? -1.5 : -5;
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(-3, -12);
    ctx.lineTo(bFootX, bFootY);
    ctx.stroke();
    ctx.fillStyle = '#334155';
    ctx.fillRect(bFootX - 3, bFootY - 2, 7, 3.5);

    // Front leg + illuminated boot sole
    const fFootX = 4 + stride * 7.5 * player.facing;
    const fFootY = player.onGround ? -1.5 : -3;
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(3, -12);
    ctx.lineTo(fFootX, fFootY);
    ctx.stroke();
    ctx.fillStyle = currentStage.zone.accent;
    ctx.fillRect(fFootX - 3, fFootY - 2, 7.5, 3.5);

    // Leaning Cyber Jacket Torso + Energy Core + Belt
    const lean = (player.vx / 245) * 3.5;
    ctx.fillStyle = '#1E293B';
    ctx.beginPath();
    ctx.moveTo(-7.5 + lean, -25.5);
    ctx.lineTo(7.5 + lean, -25.5);
    ctx.lineTo(6.5, -11);
    ctx.lineTo(-6.5, -11);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = currentStage.zone.accent;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Glowing Chest Core & Belt
    ctx.fillStyle = currentStage.zone.accent;
    ctx.beginPath();
    ctx.arc(lean * 0.7 + player.facing * 2, -19, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#475569';
    ctx.fillRect(-6, -13, 12, 2.2);

    // Articulated pumping arm + glove
    const handX = lean - stride * 6.5 * player.facing;
    ctx.strokeStyle = '#94A3B8';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(lean, -22);
    ctx.lineTo(handX, -14);
    ctx.stroke();
    ctx.fillStyle = currentStage.zone.accent;
    ctx.beginPath();
    ctx.arc(handX, -14, 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Helmet + Rim Outline + Glare Visor
    ctx.fillStyle = '#E8EEF5';
    ctx.beginPath();
    ctx.arc(lean * 1.1, -30.5, 8.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0F172A';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Helmet Neon Ear Fin & Visor
    ctx.fillStyle = currentStage.zone.accent;
    const vx = lean * 1.1 + (player.facing > 0 ? 1 : -8);
    ctx.fillRect(vx, -32.5, 7.5, 4.2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(vx + (player.facing > 0 ? 3 : 1), -32, 3, 1.5);

    ctx.restore();
  }

  function render() {
    const z = currentStage ? currentStage.zone : ZONES[0];
    ctx.fillStyle = z.bg;
    ctx.fillRect(0, 0, W, H);

    // Parallax cyber grid
    ctx.strokeStyle = z.grid;
    ctx.lineWidth = 1;
    const gridOffset = -(camX * 0.35) % 48;
    for (let x = gridOffset; x < W; x += 48) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 48) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Parallax Distant Mega-City Skyline
    const skyShift = -(camX * 0.18) % 90;
    for (let sx = skyShift - 90; sx < W + 90; sx += 90) {
      const idx = Math.round((sx - skyShift) / 90);
      const bh = 65 + Math.abs(Math.sin((sx + camX * 0.18) * 0.03 + idx)) * 110;
      ctx.fillStyle = 'rgba(18, 28, 42, 0.55)';
      ctx.fillRect(sx, H - bh, 72, bh);
      ctx.fillStyle = z.accent;
      ctx.globalAlpha = 0.28;
      ctx.fillRect(sx + 6, H - bh, 60, 2);
      ctx.globalAlpha = 0.18;
      for (let wy = H - bh + 14; wy < H - 18; wy += 16) {
        ctx.fillRect(sx + 14, wy, 10, 5);
        ctx.fillRect(sx + 44, wy, 10, 5);
      }
      ctx.globalAlpha = 1;
    }

    if (!platforms) return;
    ctx.save();
    ctx.translate(-camX, Math.max(0, (H - 440) * 0.45));

    // Beveled Platforms with Circuit Trim
    for (const p of platforms) {
      if (p.broken) {
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        continue;
      }
      const flicker = p.crumble && p.crumbleTimer >= 0 && Math.floor(p.crumbleTimer * 18) % 2 === 0;
      ctx.fillStyle = flicker ? '#3B2C1A' : '#131C28';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(p.x, p.y + p.h - 4, p.w, 4);

      let topColor = z.accent;
      if (p.pad) topColor = z.pad;
      else if (p.crumble) topColor = z.crumble;
      else if (p.vx || p.vy) topColor = z.mover;

      ctx.fillStyle = topColor;
      ctx.fillRect(p.x, p.y, p.w, p.pad ? 5 : 3.5);
      ctx.globalAlpha = 0.28;
      ctx.fillRect(p.x + 10, p.y + 8, p.w - 20, 2);
      ctx.globalAlpha = 1;

      if (p.pad) {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.fillRect(p.x + 8, p.y - 6, p.w - 16, 6);
      }
    }

    // Glowing Plasma Spikes
    for (const s of spikes) {
      const count = Math.max(2, Math.floor(s.w / 12));
      const step = s.w / count;
      for (let i = 0; i < count; i++) {
        ctx.fillStyle = '#FF5C7C';
        ctx.beginPath();
        ctx.moveTo(s.x + i * step, s.y + s.h);
        ctx.lineTo(s.x + i * step + step * 0.5, s.y);
        ctx.lineTo(s.x + (i + 1) * step, s.y + s.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFE4E6';
        ctx.beginPath();
        ctx.moveTo(s.x + i * step + step * 0.35, s.y + s.h);
        ctx.lineTo(s.x + i * step + step * 0.5, s.y + 4);
        ctx.lineTo(s.x + i * step + step * 0.65, s.y + s.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Patrol Plasma Drones with Spinning Rotors & Scanner Eye
    for (const d of drones) {
      const rSpan = 10 + Math.abs(Math.sin(globalTime * 28 + d.phase)) * 7;
      ctx.strokeStyle = '#94A3B8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(d.x - rSpan, d.y - d.r - 3);
      ctx.lineTo(d.x + rSpan, d.y - d.r - 3);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r + 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 92, 124, 0.24)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = '#334155';
      ctx.fill();
      ctx.strokeStyle = '#FF5C7C';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = '#FF5C7C';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(d.x - 1.5, d.y - 1.5, d.r * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFE4E6';
      ctx.fill();
    }

    // Spinning Diamond Energy Cores
    for (const o of orbs) {
      if (o.collected) continue;
      const oy = o.y + Math.sin(o.bob) * 4;
      const pulse = 8 + Math.sin(o.bob * 2) * 1.5;
      ctx.save();
      ctx.translate(o.x, oy);
      ctx.rotate(o.bob * 0.7);
      ctx.fillStyle = 'rgba(184, 255, 120, 0.28)';
      ctx.fillRect(-pulse - 2, -pulse - 2, (pulse + 2) * 2, (pulse + 2) * 2);
      ctx.fillStyle = '#B8FF78';
      ctx.fillRect(-pulse * 0.75, -pulse * 0.75, pulse * 1.5, pulse * 1.5);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(-pulse * 0.3, -pulse * 0.3, pulse * 0.6, pulse * 0.6);
      ctx.restore();
    }

    // Holographic Warp Gate Beacon
    const gx = goal.x, gy = goal.y;
    ctx.fillStyle = 'rgba(92, 242, 214, 0.10)';
    ctx.fillRect(gx - 15, gy - 34, 30, 60);
    ctx.strokeStyle = z.accent;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(gx - 15, gy - 34, 30, 60);
    const ringR = 12 + Math.sin(globalTime * 5) * 3;
    ctx.beginPath();
    ctx.arc(gx, gy - 4, ringR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(92, 242, 214, 0.30)';
    ctx.fill();
    ctx.stroke();

    drawCyberRunner();

    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4.5, 4.5);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  stageMenuBtn.addEventListener('click', () => {
    pushQuickResume(false);
    running = false;
    quickResumePending = hasResumableProgress;
    overlay.querySelector('h1').textContent = 'SECTOR SELECT';
    overlayDesc.textContent = `Choose any of 50 handcrafted cyber sectors or push past Stage 51 into Endless Infinity Mode.`;
    syncStageSelectorUI();
    if (quickResumePending) startBtn.textContent = `RESUME STAGE ${currentStageNum} · SCORE ${score}`;
    overlay.style.display = 'flex';
  });

  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    if (quickResumePending && selectedStageNum === currentStageNum) {
      quickResumePending = false;
      running = true;
      showToast(`RESUMED STAGE ${currentStageNum}`);
      return;
    }
    quickResumePending = false;
    hp = 3;
    score = 0;
    totalOrbs = 0;
    hasResumableProgress = true;
    loadStage(selectedStageNum);
    pushQuickResume(true);
    running = true;
  });

  window.VaultRequestQuickResume = () => {
    if (hasResumableProgress) pushQuickResume(true);
  };

  window.VaultApplyQuickResume = (rawJson) => {
    try {
      const snap = JSON.parse(rawJson);
      const st = Math.max(1, parseInt(snap.stageNum || '1', 10));
      score = parseInt(snap.score || '0', 10) || 0;
      totalOrbs = parseInt(snap.totalOrbs || '0', 10) || 0;
      hp = Math.max(1, Math.min(3, parseInt(snap.hp || '3', 10) || 3));
      loadStage(st);
      if (typeof snap.px === 'number') player.x = snap.px;
      if (typeof snap.py === 'number') { player.y = snap.py; player.vy = 0; }
      if (typeof snap.facing === 'number') player.facing = snap.facing;
      if (Array.isArray(snap.collected)) {
        orbs.forEach((o, i) => { if (snap.collected[i]) o.collected = true; });
      }
      hasResumableProgress = true;
      quickResumePending = true;
      updateHud();
      syncStageSelectorUI();
      overlay.querySelector('h1').textContent = 'QUICK RESUME READY';
      overlayDesc.textContent = `Restored Stage ${currentStageNum} (${currentStage.name}) · Score ${score} · Cores ${totalOrbs} · HP ${hp}.`;
      startBtn.textContent = `RESUME STAGE ${currentStageNum}`;
      overlay.style.display = 'flex';
    } catch (_) {}
  };

  window.addEventListener('pagehide', () => { if (hasResumableProgress) pushQuickResume(true); });

  syncStageSelectorUI();
  loadStage(1);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
